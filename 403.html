<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied — Nexira Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--color-navy-900) 0%, var(--color-navy-800) 100%); text-align: center; padding: var(--space-8); }
    .error-page__code { font-size: clamp(6rem, 15vw, 12rem); font-weight: 700; color: var(--color-gold-500); line-height: 1; margin-bottom: var(--space-4); opacity: 0.8; }
    .error-page__title { font-size: var(--font-size-2xl); color: var(--color-white); margin-bottom: var(--space-4); }
    .error-page__text { font-size: var(--font-size-lg); color: var(--color-navy-300); max-width: 480px; margin: 0 auto var(--space-8); }
    .error-page__actions { display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <p class="error-page__code">403</p>
      <h1 class="error-page__title">Access Denied</h1>
      <p class="error-page__text">You don't have permission to access this page. If you believe this is an error, please contact your administrator.</p>
      <div class="error-page__actions">
        <a href="index.html" class="btn btn--accent btn--lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Go Home</a>
        <button onclick="history.back()" class="btn btn--outline btn--lg" style="color:white;border-color:rgba(255,255,255,0.4);">Go Back</button>
      </div>
    </div>
  </div>

<!-- Firebase SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
